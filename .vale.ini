# ------------------------------------------------------------------
# Vale configuration for subodhdahal.github.io
# Docs: https://vale.sh/docs
# ------------------------------------------------------------------
#
# Styles in use:
#   Vale        - built-in spelling check + vocabulary rules
#                 (Vale.Spelling / Vale.Terms / Vale.Avoid)
#   write-good  - clarity: wordiness, passive voice, weasel words
#   proselint   - grammar & punctuation consistency
#   Readability - per-post readability scores (Flesch, SMOG, LIX, ...)
#   ai-tells    - flags AI-slop patterns (tricolons, "seamlessly", ...)
#   personal    - project-specific AI-slop rules, the personal blog's
#                 house style. Combines rules forked from the
#                 draft-text skill (negative parallelism, knowledge
#                 disclaimers, staged openers, vague connection, ...)
#                 and bans em/en dashes, which the blog guide
#                 prohibits
#
# Package styles are managed with: `vale sync`

StylesPath = .github/styles
MinAlertLevel = suggestion

# Project-specific vocabulary. Words added to
#   .github/styles/config/vocabularies/Project/accept.txt
# are accepted (and their casing enforced via Vale.Terms); entries in
#   .github/styles/config/vocabularies/Project/reject.txt
# are flagged via Vale.Avoid.
Vocab = Blog

# Style packages to install with `vale sync` (see https://vale.sh/explorer)
Packages = proselint, write-good, Readability, https://github.com/tbhb/vale-ai-tells/releases/download/v1.34.0/ai-tells.zip

# ------------------------------------------------------------------
# Blog posts (Markdown)
# ------------------------------------------------------------------
[*.md]
BasedOnStyles = Vale, write-good, proselint, Readability, ai-tells, personal

# --- ai-tells ---
# Disable rules that don't fit this blog's voice or topics, or that
# conflict with a personal rule:
#   FormalTransitions - bans "For example" / "For instance" (normal English)
#   JourneyMetaphors  - flags "journey" / "along the way", but the blog
#                       also writes about literal travel
#   EmDashUsage       - replaced by personal.DashPunctuation; the
#                       package also tells the writer to "use a real
#                       em dash", which the blog bans
#   DoubleHyphen      - replaced by personal.DashPunctuation for the
#                       same reason
#   ColonUsage        - fires on colons that legitimately introduce a
#                       complete sentence ("## Section: Not just X"),
#                       which the blog uses freely
#   VerbTricolon      - false positives on list constructions like
#                       "my phone, a GoPro, and a drone"
#
# Domain-specific rules (BareReaches, FigurativeLives, FigurativeStays,
# FigurativeWins, FigurativeFires, FigurativeShape, FigurativePays,
# FigurativeQuantities) are NOT disabled globally. Each rule's own
# message recommends disabling it for a specific prose domain
# (transit, biography, lodging, sports, finance, etc.), and the blog
# only writes about some of those domains in some posts. They stay
# enabled globally; per-section disables below turn them off for the
# specific posts where the rule is hitting legitimate domain prose.
ai-tells.FormalTransitions = NO
ai-tells.JourneyMetaphors = NO
ai-tells.EmDashUsage = NO
ai-tells.DoubleHyphen = NO
ai-tells.ColonUsage = NO
ai-tells.VerbTricolon = NO

# --- write-good ---
# E-Prime flags every form of "to be" (is/are/was/...). Far too noisy
# for first-person blog prose, so disable it.
# So/ThereIs: "So" at the start of a sentence and "There is/are" are
# normal in the blog's casual voice.
write-good.E-Prime = NO
write-good.So = NO
write-good.ThereIs = NO

# --- proselint ---
# The blog writes "5 am" / "9 pm" without periods; keep that style
# instead of being pushed toward "5 a.m." / "9 p.m."
# But/GenderBias: starting a paragraph with "but" is fine in blog
# prose, and "middleman" -> "intermediary" is a tone choice, not a fix.
proselint.DateCase = NO
proselint.But = NO
proselint.GenderBias = NO

# --- Readability ---
# Grade-level scores (FleschKincaid, SMOG, ColemanLiau, etc.) are a
# poor proxy for good blog writing. Technical posts naturally read at
# grade 9-12, and a personal voice is more important than the score.
Readability = NO

# ------------------------------------------------------------------
# Per-post rule disables
# ------------------------------------------------------------------
# ai-tells rules whose own messages recommend disabling for a specific
# prose domain. They stay enabled globally so new posts in unrelated
# domains still get caught. These sections turn them off for posts
# that legitimately write in the rule's exception domain.
#
# [content/blog/2022-in-review.md]
# FigurativeLives - rule says "Disable for biography or housing
#   prose." The post is a year-in-review, so biographical phrasing
#   like "their loved ones living there" / "their lives as" is
#   legitimate.
#
# [content/blog/hiking-tsho-rolpa-lake-trail-in-nepal.md]
# BareReaches - rule says "Disable for transit or physics prose."
#   "a jeep to reach Chhetchhet" / "the night after reaching Tsho"
#   are literal transit.
#
# [content/blog/stream-deck-youtube-music.md]
# BareReaches - "no longer reach forward to press buttons" is a
#   physical description of moving the Stream Deck, not a figurative
#   arrival.
#
# [content/blog/reading-and-discovery-feed-curation.md]
# FigurativeShape - rule says "Disable for geometry, graphics, or
#   array-dimension prose." The hit is the hero image's alt text
#   ("Shaping my personal reading content flow"), which is
#   describing a personal system, not a geometry.
#
# [content/blog/self-hosting-my-git-forge.md]
# FigurativePays - rule says "Disable for finance or commerce prose."
#   "at no cost" is describing a free, self-hosted service, which
#   is the finance/commerce domain the rule already exempts.
#
# [content/blog/ai-pattern-selection-in-fabric.md]
# FigurativeQuantities - "a handful" is a normal English idiom for
#   a small number, used in casual prose, not a quantity metaphor
#   in the technical sense the rule is targeting.
#
# [content/blog/worktrees-with-worktrunk.md]
# BareReaches / FigurativeStays / FigurativeWins / FigurativeFires -
#   all are tech/CLI prose where the rule's intended domain
#   (transit, lodging, sports, firearms) does not apply:
#   "reach the canonical .env" is a file-path access;
#   "stays separate" is a state assertion; "won't" trips FigurativeWins
#   because the rule's lookahead only excludes the ASCII apostrophe,
#   not the typographic one (U+2019); "fires" describes a hook
#   triggering at a lifecycle point.

[content/blog/2022-in-review.md]
ai-tells.FigurativeLives = NO

[content/blog/hiking-tsho-rolpa-lake-trail-in-nepal.md]
ai-tells.BareReaches = NO

[content/blog/stream-deck-youtube-music.md]
ai-tells.BareReaches = NO

[content/blog/reading-and-discovery-feed-curation.md]
ai-tells.FigurativeShape = NO

[content/blog/self-hosting-my-git-forge.md]
ai-tells.FigurativePays = NO

[content/blog/ai-pattern-selection-in-fabric.md]
ai-tells.FigurativeQuantities = NO

[content/blog/worktrees-with-worktrunk.md]
ai-tells.BareReaches = NO
ai-tells.FigurativeStays = NO
ai-tells.FigurativeWins = NO
ai-tells.FigurativeFires = NO

# ------------------------------------------------------------------
# content/library.json (rendered prose)
# ------------------------------------------------------------------
# The library page stores user-written descriptions and recommendations
# alongside verbatim book quotes. The descriptions and recommendations
# still go through the full rule set above. The following rules would
# only fire on the verbatim book quotes (the user has cleaned up their
# own prose), so they are disabled for this file to keep the quotes
# intact. The glob also covers test extractions of library.json prose
# (e.g. content/library-prose.md) that the author runs through Vale
# during review.
#
#   personal.DashPunctuation     - BNW quote has a Huxley em dash
#   write-good.Passive           - Factfulness quote uses "be understood" twice
#   write-good.TooWordy          - Stillness quote has "In order to", "possess"
#   ai-tells.FillerPhrases       - Stillness quote has "In order to"
#   personal.PrescriptiveLanguage - Stillness quote has "you must"
[content/library*.md]
personal.DashPunctuation = NO
write-good.Passive = NO
write-good.TooWordy = NO
ai-tells.FillerPhrases = NO
personal.PrescriptiveLanguage = NO
